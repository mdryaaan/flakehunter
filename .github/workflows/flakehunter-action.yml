# Reusable weekly flake digest.
#
# Drop this into .github/workflows/ in your own repository. It scans the last
# seven days of CI, classifies every flaky occurrence, and posts a digest as a
# GitHub issue.
#
# Defaults to the deterministic rule-based classifier so it works with no extra
# setup. To use a language model instead, either point OLLAMA_HOST at a reachable
# Ollama instance, or set the ANTHROPIC_API_KEY secret and switch PROVIDER.
name: Weekly flake digest

on:
  schedule:
    # Monday 06:00 UTC, before most people start triaging.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: Days of history to scan
        required: false
        default: '7'
      provider:
        description: 'deterministic | ollama | claude'
        required: false
        default: deterministic

permissions:
  contents: read
  issues: write

jobs:
  digest:
    name: Scan, classify and post
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DAYS: ${{ github.event.inputs.days || '7' }}
      PROVIDER: ${{ github.event.inputs.provider || 'deterministic' }}
      FLAKEHUNTER_VERSION: latest
    steps:
      - uses: actions/checkout@v4

      # Download the prebuilt binary rather than compiling from source: it turns
      # a ~20s Go build into a ~2s download and drops the toolchain requirement.
      # Falls back to `go install` if no release asset matches.
      - name: Install flakehunter
        run: |
          set -euo pipefail
          version="${FLAKEHUNTER_VERSION}"
          if [ "$version" = "latest" ]; then
            release_json=$(curl -sSfL https://api.github.com/repos/mdryaaan/flakehunter/releases/latest)
            version=$(printf '%s' "$release_json" | grep '"tag_name"' | head -1 | cut -d'"' -f4)
          fi

          url="https://github.com/mdryaaan/flakehunter/releases/download/${version}/flakehunter_${version#v}_linux_amd64.tar.gz"
          if curl -sSfL "$url" -o /tmp/fh.tar.gz; then
            tar -xzf /tmp/fh.tar.gz -C /tmp flakehunter
            sudo install -m 0755 /tmp/flakehunter /usr/local/bin/flakehunter
          else
            echo "no release asset at ${url}; building from source"
            curl -sSfL https://go.dev/dl/go1.22.7.linux-amd64.tar.gz -o /tmp/go.tgz
            sudo tar -C /usr/local -xzf /tmp/go.tgz
            export PATH="/usr/local/go/bin:$(go env GOPATH 2>/dev/null || echo "$HOME/go")/bin:$PATH"
            /usr/local/go/bin/go install github.com/mdryaaan/flakehunter@latest
            sudo install -m 0755 "$HOME/go/bin/flakehunter" /usr/local/bin/flakehunter
          fi

          flakehunter version

      - name: Scan for flaky occurrences
        env:
          # The default token can read this repository's Actions history.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flakehunter scan \
            --repo "${GITHUB_REPOSITORY}" \
            --days "${DAYS}" \
            --output scan.json

      - name: Classify root causes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          flakehunter classify \
            --input scan.json \
            --provider "${PROVIDER}" \
            --output classified.json

      - name: Render the digest
        run: |
          flakehunter report \
            --input classified.json \
            --format digest \
            --since "${DAYS}" \
            --output digest.md
          cat digest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post the digest as an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Skip the issue entirely when CI was clean — a weekly "nothing to
          # report" issue is exactly how a bot gets muted.
          if grep -q "No flaky occurrences detected" digest.md; then
            echo "CI was clean this week; not opening an issue."
            exit 0
          fi

          gh issue create \
            --title "Flake digest — week of $(date -u +%Y-%m-%d)" \
            --body-file digest.md \
            --label "ci,flaky-test"
